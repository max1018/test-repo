name: Pixelwright Actions Heartbeat

on:
  push:
    branches: [pixelwright-staging-100-20260716]
    paths:
      - ".github/workflows/pixelwright-heartbeat.yml"

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Persist heartbeat
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TARGET_BRANCH: pixelwright-staging-100-20260716
          RESULT_PATH: pixelwright_staging/results/heartbeat.json
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import base64, json, os, urllib.error, urllib.parse, urllib.request
          from datetime import datetime, timezone
          result = {
              "status": "actions_available",
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "head_sha": os.environ.get("GITHUB_SHA"),
              "run_url": os.environ["RUN_URL"],
              "recorded_at": datetime.now(timezone.utc).isoformat(),
          }
          content = json.dumps(result, indent=2, sort_keys=True).encode()
          repo, branch, path = os.environ["REPOSITORY"], os.environ["TARGET_BRANCH"], os.environ["RESULT_PATH"]
          url = f"https://api.github.com/repos/{repo}/contents/{path}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
              "User-Agent": "pixelwright-actions-heartbeat",
          }
          sha = None
          try:
              req = urllib.request.Request(url + "?ref=" + urllib.parse.quote(branch, safe=""), headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  sha = json.loads(response.read())["sha"]
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
          payload = {"message": "Record Pixelwright Actions heartbeat", "content": base64.b64encode(content).decode(), "branch": branch}
          if sha:
              payload["sha"] = sha
          req = urllib.request.Request(url, data=json.dumps(payload).encode(), method="PUT", headers=headers)
          with urllib.request.urlopen(req, timeout=30) as response:
              print(response.status)
          PY
