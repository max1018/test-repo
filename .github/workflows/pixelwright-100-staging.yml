name: Pixelwright 100-Mission Staging Acceptance

on:
  pull_request:
    branches: [master]
    paths:
      - "pixelwright_staging/**"
      - ".github/workflows/pixelwright-100-staging.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  id-token: write
  actions: read

concurrency:
  group: pixelwright-100-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  staging-acceptance:
    name: 100 governed staging missions
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pixelwright
          POSTGRES_PASSWORD: pixelwright
          POSTGRES_DB: pixelwright
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pixelwright -d pixelwright"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://pixelwright:pixelwright@127.0.0.1:5432/pixelwright
      MINIO_ENDPOINT: http://127.0.0.1:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MISSION_COUNT: "100"
      ARTIFACT_DIR: artifacts/pixelwright-staging-100
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start pinned S3-compatible Object Lock service
        run: |
          docker run -d --name pixelwright-minio \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER="$MINIO_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$MINIO_SECRET_KEY" \
            quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z \
            server /data --console-address ':9001'
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs pixelwright-minio
          exit 1

      - name: Install browser, OCR, and staging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr postgresql-client
          python -m pip install --upgrade pip
          python -m pip install \
            'boto3>=1.35,<2' \
            'cryptography>=43,<46' \
            'pillow>=11,<12' \
            'playwright>=1.52,<2' \
            'psycopg[binary]>=3.2,<4' \
            'PyJWT>=2.10,<3' \
            'pytesseract>=0.3.13,<1' \
            'requests>=2.32,<3'
          python -m playwright install --with-deps chromium
          python -m py_compile pixelwright_staging/harness.py

      - name: Execute 100 real staging missions
        run: |
          mkdir -p artifacts/pixelwright-staging-100
          set -o pipefail
          python pixelwright_staging/harness.py 2>&1 | tee artifacts/pixelwright-staging-100/harness.log

      - name: Close any remaining staging issues after a failure
        if: always()
        run: |
          mkdir -p artifacts/pixelwright-staging-100
          python pixelwright_staging/harness.py --cleanup-only 2>&1 | tee artifacts/pixelwright-staging-100/cleanup.log

      - name: Capture infrastructure diagnostics
        if: always()
        run: |
          mkdir -p artifacts/pixelwright-staging-100/diagnostics
          docker logs pixelwright-minio > artifacts/pixelwright-staging-100/diagnostics/minio.log 2>&1 || true
          PGPASSWORD=pixelwright psql -h 127.0.0.1 -U pixelwright -d pixelwright -c "select version();" > artifacts/pixelwright-staging-100/diagnostics/postgres-version.txt 2>&1 || true
          PGPASSWORD=pixelwright psql -h 127.0.0.1 -U pixelwright -d pixelwright -c "select status,count(*) from missions group by status order by status;" > artifacts/pixelwright-staging-100/diagnostics/mission-counts.txt 2>&1 || true
          python --version > artifacts/pixelwright-staging-100/diagnostics/python-version.txt
          tesseract --version > artifacts/pixelwright-staging-100/diagnostics/tesseract-version.txt 2>&1 || true

      - name: Upload staging acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixelwright-100-staging-${{ github.run_id }}
          path: artifacts/pixelwright-staging-100
          if-no-files-found: warn
          retention-days: 30
