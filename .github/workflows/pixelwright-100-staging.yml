name: Pixelwright 100-Mission Staging Acceptance

on:
  push:
    branches: [pixelwright-staging-100-20260716]
    paths:
      - "pixelwright_staging/**"
      - ".github/workflows/pixelwright-100-staging.yml"
  pull_request:
    branches: [master]
    paths:
      - "pixelwright_staging/**"
      - ".github/workflows/pixelwright-100-staging.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write
  id-token: write
  actions: read

concurrency:
  group: pixelwright-staging-100-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Execute 100 governed staging missions
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pixelwright
          POSTGRES_PASSWORD: pixelwright
          POSTGRES_DB: pixelwright
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pixelwright -d pixelwright"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize acceptance harness
        run: |
          cat pixelwright_staging/payload/part*.txt > /tmp/pixelwright-harness.b64
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          payload = Path('/tmp/pixelwright-harness.b64').read_text().strip()
          Path('/tmp/pixelwright_staging_harness.py').write_bytes(
              gzip.decompress(base64.b64decode(payload))
          )
          PY
          python -m py_compile /tmp/pixelwright_staging_harness.py

      - name: Install system and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr postgresql-client
          python -m pip install --upgrade pip
          python -m pip install \
            "psycopg[binary]>=3.2,<4" \
            "boto3>=1.35,<2" \
            "PyJWT[crypto]>=2.9,<3" \
            "playwright>=1.51,<2" \
            "Pillow>=11,<12" \
            "pytesseract>=0.3.13,<1" \
            "opencv-python-headless>=4.10,<5" \
            "requests>=2.32,<3"
          python -m playwright install --with-deps chromium

      - name: Start S3-compatible Object Lock service
        run: |
          docker run -d --name pixelwright-minio \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin123 \
            minio/minio:latest server /data --console-address ":9001"
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs pixelwright-minio
          exit 1

      - name: Execute acceptance matrix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATABASE_URL: postgresql://pixelwright:pixelwright@127.0.0.1:5432/pixelwright
          MINIO_ENDPOINT: http://127.0.0.1:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin123
          MISSION_COUNT: "100"
          BROWSER_WORKERS: "3"
          ARTIFACT_DIR: artifacts/pixelwright-staging-100
        run: |
          python /tmp/pixelwright_staging_harness.py

      - name: Close any remaining temporary staging issues
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATABASE_URL: postgresql://pixelwright:pixelwright@127.0.0.1:5432/pixelwright
          MINIO_ENDPOINT: http://127.0.0.1:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin123
          ARTIFACT_DIR: artifacts/pixelwright-staging-100
        run: |
          python /tmp/pixelwright_staging_harness.py --cleanup-only

      - name: Capture infrastructure diagnostics
        if: always()
        run: |
          mkdir -p artifacts/pixelwright-staging-100/diagnostics
          docker ps -a > artifacts/pixelwright-staging-100/diagnostics/docker-ps.txt
          docker logs pixelwright-minio > artifacts/pixelwright-staging-100/diagnostics/minio.log 2>&1 || true
          PGPASSWORD=pixelwright psql -h 127.0.0.1 -U pixelwright -d pixelwright \
            -c "select version();" > artifacts/pixelwright-staging-100/diagnostics/postgres-version.txt 2>&1 || true
          PGPASSWORD=pixelwright psql -h 127.0.0.1 -U pixelwright -d pixelwright \
            -c "select status,count(*) from missions group by status order by status;" \
            > artifacts/pixelwright-staging-100/diagnostics/mission-counts.txt 2>&1 || true

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixelwright-100-staging-${{ github.run_id }}
          path: artifacts/pixelwright-staging-100
          if-no-files-found: warn
          retention-days: 30

      - name: Report acceptance result to draft PR
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: "3"
          JOB_STATUS: ${{ job.status }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          summary_path = Path("artifacts/pixelwright-staging-100/SUMMARY.md")
          if summary_path.exists():
              summary = summary_path.read_text(encoding="utf-8", errors="replace")
          else:
              summary = "The acceptance harness did not produce SUMMARY.md. Inspect the workflow logs and uploaded diagnostics."
          body = (
              "## Pixelwright 100-mission staging result\n\n"
              f"**Job status:** `{os.environ['JOB_STATUS']}`\n\n"
              f"**Workflow run:** {os.environ['RUN_URL']}\n\n"
              + summary[:50000]
          )
          payload = json.dumps({"body": body}).encode("utf-8")
          url = (
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}"
              f"/issues/{os.environ['PR_NUMBER']}/comments"
          )
          request = urllib.request.Request(
              url,
              data=payload,
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
                  "User-Agent": "pixelwright-staging-acceptance",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              print(response.status)
          PY
