<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Texas Event Radar</title>
  <style>
    body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f8fb;color:#172033;display:grid;min-height:100vh;place-items:center}.shell{max-width:680px;padding:32px;text-align:center}.spinner{width:42px;height:42px;margin:0 auto 18px;border:4px solid #dce3ef;border-top-color:#6757d9;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}h1{font-size:clamp(1.7rem,4vw,2.6rem);margin:.2rem 0 .7rem}p{line-height:1.6;color:#5b667d}.error{display:none;background:#fff;border:1px solid #e2e6ee;border-radius:18px;padding:22px;box-shadow:0 16px 45px rgba(34,45,70,.08)}
  </style>
</head>
<body>
  <main class="shell">
    <div id="loading"><div class="spinner"></div><h1>Loading Texas Event Radar</h1><p>Opening the latest published dashboard…</p></div>
    <div id="error" class="error"><h1>Dashboard could not load</h1><p>The compressed dashboard payload could not be opened in this browser. Use a current version of Chrome, Edge, Firefox, or Safari.</p></div>
  </main>
  <script>
  (async()=>{try{
    const base='https://raw.githubusercontent.com/max1018/test-repo/master/';
    const updateFiles=['updates/current-events.js','updates/current-events-2026-07-24.js','updates/current-events-2026-07-25.js','updates/current-events-2026-07-26.js','updates/current-events-2026-07-27.js','updates/current-events-2026-07-28.js'];
    const responses=await Promise.all([
      fetch(base+'parts/p00.txt',{cache:'no-store'}),
      ...updateFiles.map(path=>fetch(base+path,{cache:'no-store'}))
    ]);
    const payloadResponse=responses[0];
    const updateResponses=responses.slice(1);
    if(!payloadResponse.ok)throw new Error('payload');
    const b64=(await payloadResponse.text()).trim();
    const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    if(!('DecompressionStream' in window))throw new Error('browser');
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    let html=await new Response(stream).text();
    for(const response of updateResponses){
      if(!response.ok)continue;
      const additions=(await response.text()).trim();
      const match=additions.match(/id:["']([^"']+)["']/);
      const firstId=match?match[1]:'';
      if(additions && (!firstId || (!html.includes("id:'"+firstId+"'") && !html.includes('id:"'+firstId+'"')))){
        html=html.replace('const radarEvents = [','const radarEvents = [\n'+additions+',');
      }
    }
    html=html.replace('2026-07-14T12:03:00-05:00','2026-07-28T08:00:00-05:00');
    html=html.replace(/Live build · [^<\n]*/,'Live build · July 28, 2026 · 8:00 AM CT · public dashboard republished');
    html=html.replace(/HTML regenerated [^<\n]*CT\./,'HTML regenerated July 28, 2026 at 8:00 AM CT.');
    html=html.replaceAll('regenerated July 14, 2026','regenerated July 28, 2026');
    document.open();document.write(html);document.close();
  }catch(e){document.getElementById('loading').style.display='none';document.getElementById('error').style.display='block';console.error(e)}})();
  </script>
</body>
</html>
